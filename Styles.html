<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#1c2330;--mut:#66707f;--line:#e2e7ee;--acc:#1a73e8;--acc-d:#1558b0;--ok:#188038;--warn:#b06000;--bad:#d93025;--chip:#eef3fb}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.topbar{position:sticky;top:0;z-index:20;display:flex;gap:12px;align-items:center;background:#101828;color:#fff;padding:10px 16px}
.brand{font-weight:700;font-size:16px;white-space:nowrap}
.nav{display:flex;gap:4px;flex-wrap:wrap;flex:1}
.nav button{background:transparent;border:0;color:#cdd6e4;padding:7px 10px;border-radius:8px;cursor:pointer;font-size:13px}
.nav button.on,.nav button:hover{background:#263248;color:#fff}
.topright{display:flex;gap:10px;align-items:center}
.bootstatus{font-size:12px;color:#9fb0c9}
.view{max-width:1280px;margin:0 auto;padding:16px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.card .k{font-size:12px;color:var(--mut)}
.card .v{font-size:24px;font-weight:700}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.panel h3{margin:0 0 8px;font-size:14px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
input,select,textarea{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid #bfd6f8;border-color:var(--acc)}
.btn{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font-size:14px}
.btn:hover{background:var(--acc-d)}
.btn:disabled{opacity:.6;cursor:wait}
.btn.ghost{background:#263248;color:#fff}
.btn.danger{background:var(--bad)}
.btn.plain{background:#eef1f6;color:var(--ink)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mut);font-weight:600;position:sticky;top:0;background:var(--card)}
.tblwrap{overflow:auto;max-height:60vh;border:1px solid var(--line);border-radius:10px}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;background:var(--chip);font-size:12px}
.pill.ok{background:#e6f4ea;color:var(--ok)} .pill.bad{background:#fce8e6;color:var(--bad)} .pill.warn{background:#fef7e0;color:var(--warn)}
.mut{color:var(--mut)} .err{color:var(--bad)} .ok{color:var(--ok)}
.rowbtns{display:flex;gap:6px;flex-wrap:wrap}
.link{background:none;border:0;color:var(--acc);cursor:pointer;padding:2px 4px;font-size:13px}
.toast{position:fixed;right:14px;bottom:14px;display:flex;flex-direction:column;gap:8px;z-index:99;max-width:min(420px,90vw)}
.toast div{background:#101828;color:#fff;padding:10px 14px;border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.25)}
.toast div.bad{background:#7a1f1a}
.spin{display:inline-block;width:12px;height:12px;border:2px solid #cfe0fa;border-top-color:#fff;border-radius:50%;animation:sp 0.7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.modalback{position:fixed;inset:0;background:rgba(10,15,25,.5);display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;z-index:50}
.modal{background:#fff;border-radius:14px;max-width:640px;width:100%;padding:16px;max-height:88vh;overflow:auto}
.modal h3{margin:0 0 10px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fgrid .full{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mut)}
label.f input,label.f select,label.f textarea{font-size:14px;color:var(--ink)}
.acwrap{position:relative}
.aclist{position:absolute;left:0;right:0;top:100%;background:#fff;border:1px solid var(--line);border-radius:10px;max-height:240px;overflow:auto;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.15)}
.aclist div{padding:8px 10px;cursor:pointer}
.aclist div.on,.aclist div:hover{background:var(--chip)}
.pager{display:flex;gap:8px;align-items:center;margin-top:8px;font-size:13px;color:var(--mut)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
@media(max-width:640px){.fgrid{grid-template-columns:1fr}.topbar{flex-wrap:wrap}}
</style>
